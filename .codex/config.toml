# Fail-closed project configuration for the orchestrator process.
# Specialist profiles layer complete transports in a separate `codex exec` process;
# the main process must never receive these modelling MCPs.

[mcp_servers.neko]
command = "__orchestrator_disabled_neko__"
enabled = false

[mcp_servers.maboss]
command = "__orchestrator_disabled_maboss__"
enabled = false

[mcp_servers.physicell]
command = "__orchestrator_disabled_physicell__"
enabled = false

# Local dispatcher: workstation paths stay in ignored .setup/ settings.
# Start Codex from the project root. The live-isolation/equivalence gate passed;
# see docs/specialist-dispatcher.md. The CLI remains available as a fallback.
[mcp_servers.specialist_dispatcher]
command = "python3"
args = ["scripts/codex/dispatcher/launch.py"]
enabled = true
required = true
startup_timeout_sec = 30

# A user-global optional modelling server must not leak into the orchestrator.
[mcp_servers.biomass]
command = "__orchestrator_disabled_biomass__"
enabled = false
