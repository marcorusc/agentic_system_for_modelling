# Fail-closed project configuration for the orchestrator process.
# Specialist profiles layer complete transports in a separate `codex exec` process;
# the main process must never receive these modelling MCPs.

[mcp_servers.neko]
command = "__orchestrator_disabled_neko__"
enabled = false

[mcp_servers.maboss]
command = "__orchestrator_disabled_maboss__"
enabled = false

[mcp_servers.physicell]
command = "__orchestrator_disabled_physicell__"
enabled = false
