schema_version = 1
supported_systems = ["Linux"]
python_minimum = "3.11"
python_environment = "3.11"
index_url = "https://pypi.org/simple"
# Tested released backend set; historical workflow snapshots retain their original versions.
# Source: https://github.com/marcorusc/mcp-biomodelling-servers
package = "mcp-biomodelling-servers"
version = "2.5.2"
# NeKo 1.10.3 (CI-tested with 2.5.2; supported range >=1.10.2,<2) adds seed mapping and strict custom-table sign parsing.
dependency_pins = { nekomata = "1.10.3" }
executables = ["mcp-neko-server", "mcp-maboss-server", "mcp-physicell-server"]
imports = ["mcp", "neko", "maboss", "physicell_config"]
# 2.5.x bundles cmaboss and PyGraphviz: no MaBoSS executable or Graphviz install is needed.

# Marketplace plugins publishing the same servers. `--environment-mode plugin`
# launches each specialist's server with the plugin's own pinned command, but
# inline in that specialist only; the plugins themselves must not be enabled here.
[plugins]
marketplace = "marcorusc/mcp-biomodelling-servers"
marketplace_name = "marcorusc"
launcher = "uvx"
servers = ["neko", "maboss", "physicell", "biomass"]
