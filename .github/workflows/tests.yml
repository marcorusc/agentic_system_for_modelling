name: Regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/run_tests.py

  dispatcher-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r scripts/codex/dispatcher/requirements.txt
      - run: python -c "from mcp.server import Server"
      - run: python scripts/run_tests.py

  released-backends:
    name: Contracts with the released backend set
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the pinned release from setup/dependencies.toml
        run: |
          python - <<'PYPINS' > released-requirements.txt
          import tomllib
          manifest = tomllib.load(open("setup/dependencies.toml", "rb"))
          print(f'{manifest["package"]}=={manifest["version"]}')
          for name, version in sorted(manifest["dependency_pins"].items()):
              print(f"{name}=={version}")
          PYPINS
          cat released-requirements.txt
          python -m pip install -r released-requirements.txt
          python -m pip check
      - name: Run all repository regression suites with backend contracts available
        run: python scripts/run_tests.py

  plugin-launch:
    name: Marketplace plugin launch (uvx) starts every server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install uv
      - name: Resolve the launch and list each server's tools without calling them
        run: |
          python - <<'PYPLUGIN'
          import json, shutil, sys, tomllib
          from pathlib import Path
          sys.path.insert(0, ".")
          from scripts.setup_support import environment, verify
          manifest = tomllib.loads(Path("setup/dependencies.toml").read_text())
          uvx = shutil.which("uvx")
          resolved = environment.verify_plugin(uvx, manifest)
          probes = verify.probe_servers(None, with_biomass=True, plugin={"uvx": uvx, "manifest": manifest})
          print(json.dumps({"resolved": resolved, "probes": probes}, indent=2))
          sys.exit(0 if resolved["passed"] and probes["passed"] else 1)
          PYPLUGIN
