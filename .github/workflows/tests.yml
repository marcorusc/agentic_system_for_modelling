name: Regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/run_tests.py

  dispatcher-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r scripts/codex/dispatcher/requirements.txt
      - run: python -c "from mcp.server import Server"
      - run: python scripts/run_tests.py

  wave1-integration:
    name: Wave 1 contracts with pinned companion sources
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Graphviz runtime and headers
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends graphviz libgraphviz-dev
      - name: Install exact merged Wave 1 sources
        run: |
          python -m pip install -r setup/requirements-wave1-review.txt
          python -m pip check
          python - <<'PYVERSIONS'
          from importlib.metadata import distribution
          import json
          from pathlib import Path
          for name, expected in {
              "nekomata": "1.10.2",
              "physicell-settings": "0.6.3",
              "mcp-biomodelling-servers": "2.5.0",
          }.items():
              actual = distribution(name).version
              assert actual == expected, (name, expected, actual)
              print(f"{name}=={actual}")
          for line in Path("setup/requirements-wave1-review.txt").read_text().splitlines():
              if not line.strip() or line.startswith("#"):
                  continue
              name, source = line.split(" @ git+", 1)
              url, commit = source.rsplit("@", 1)
              installed = json.loads(distribution(name).read_text("direct_url.json") or "{}")
              assert installed.get("url") == url, (name, installed)
              vcs = installed.get("vcs_info", {})
              assert vcs.get("vcs") == "git" and vcs.get("commit_id") == commit, (name, installed)
              print(f"{name} source verified: {commit}")
          PYVERSIONS
      - name: Run all repository regression suites with backend contracts available
        run: python scripts/run_tests.py
